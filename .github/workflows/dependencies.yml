name: Dependency security
on:
  pull_request:
    paths: ['Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'pyproject.toml', '.github/workflows/dependencies.yml']
  push:
    branches: ['main']
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  python:
    strategy:
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pip-audit
      - run: python -m pip_audit --skip-editable
