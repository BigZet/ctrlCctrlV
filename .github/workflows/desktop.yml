name: Desktop checks and builds

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check target architecture
        run: python -c "import platform, struct; expected = 'arm64' if platform.system() == 'Darwin' else 'AMD64'; assert platform.machine() == expected and struct.calcsize('P') == 8, (platform.system(), platform.machine()); print(platform.system(), platform.machine())"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ctrlcctrlv --smoke --data-dir artifacts/ci-smoke
      - name: Build Windows installer and verify install, upgrade and uninstall
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py --installer --verify-installer
      - name: Build macOS ARM64 DMG and verify installed copy
        if: runner.os == 'macOS'
        run: python scripts/build_macos.py --development --dmg --verify-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ctrlCctrlV-${{ runner.os }}
          path: |
            artifacts/builds/windows/ctrlCctrlV-windows-x64.zip
            artifacts/builds/windows/ctrlCctrlV-windows-x64.sha256
            artifacts/builds/windows/ctrlCctrlV-*-windows-x64-setup.exe
            artifacts/builds/windows/ctrlCctrlV-*-windows-x64-setup.sha256
            artifacts/builds/dist/ctrlCctrlV-*-macos-arm64.dmg
            artifacts/builds/dist/ctrlCctrlV-*-macos-arm64.dmg.sha256
          if-no-files-found: error
