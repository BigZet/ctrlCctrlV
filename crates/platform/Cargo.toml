[package]
name = "ctrlcctrlv-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native Windows and macOS integration for ctrlCctrlV"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = "3.7.0"
global-hotkey = "0.9.0"
xcap = "0.9.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
