[package]
name = "ctrlcctrlv-app"
description = "ctrlCctrlV desktop shell: tray, global hotkeys, region OCR and typing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ctrlcctrlv"
path = "src/main.rs"

[dependencies]
ctrlcctrlv-core = { path = "../core" }
ctrlcctrlv-platform = { path = "../platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.9.0"
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tokio = { version = "1.53.3", features = ["time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
