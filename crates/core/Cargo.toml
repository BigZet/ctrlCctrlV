[package]
name = "ctrlcctrlv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
caseless = "0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
fs4 = "1.1.0"
futures-util = "0.3.34"
hex = "0.4.3"
keyring-core = "1.0.1"
png = "0.18.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.0"
sysinfo = "0.38.4"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "net", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
toml = "1.1.8"
tree-sitter = "0.26.13"
tree-sitter-python = "0.25.0"
walkdir = "2.5.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[[bin]]
name = "fake-llama-server"
path = "src/bin/fake-llama-server.rs"
test = false
doc = false
