[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlcctrlv"
version = "0.1.1"
description = "Local and OpenRouter screen OCR and controlled keyboard transfer for macOS and Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "black>=25,<27",
  "sqlparse>=0.5,<1",
  "clang-format>=21,<23",
  "pygments>=2.19,<3",
  "XlsxWriter>=3.2,<4",
  "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
ctrlcctrlv = "ctrlcctrlv.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrlcctrlv = ["assets/*.png", "assets/*.icns", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
